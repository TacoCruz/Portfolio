<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--{TITLE}--></title>
<meta name="description" content="<!--{DESCRIPTION}-->">
<meta property="og:title" content="<!--{TITLE}-->">
<meta property="og:description" content="<!--{OG_DESCRIPTION}-->">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070B14'/><text x='50' y='68' font-size='52' font-family='monospace' font-weight='700' text-anchor='middle' fill='%2334D399'><!--{FAVICON_INITIALS}--></text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B14;
  --bg-2:#0B1120;
  --card:#0E1524;
  --card-2:#111A2E;
  --border:rgba(148,163,184,.14);
  --border-strong:rgba(148,163,184,.28);
  --text:#E7EBF3;
  --muted:#8C96AB;
  --muted-2:#5B6478;
  --accent:#34D399;
  --accent-dim:rgba(52,211,153,.14);
  --accent-glow:rgba(52,211,153,.35);
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --nav-h:72px;
  --radius:16px;
  --container:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--accent);color:#04110B}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#1E293B;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#2C3A52}
a{color:var(--accent);text-decoration:none}
img{max-width:100%;display:block}
.container{max-width:var(--container);margin:0 auto;padding:0 28px}

/* ---------- Nav ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;
  transition:background .3s ease,border-color .3s ease,backdrop-filter .3s ease;
  border-bottom:1px solid transparent;
}
.nav.scrolled{background:rgba(7,11,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.logo{font-family:var(--font-mono);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--text);display:flex;align-items:center;gap:2px}
.logo .dc{color:var(--text)}
.logo .dot{color:var(--accent)}
.logo .pf{color:var(--muted);font-weight:400}
.logo:hover .pf{color:var(--text)}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{
  font-family:var(--font-mono);font-size:13.5px;color:var(--muted);
  padding:8px 14px;border-radius:8px;transition:color .2s,background .2s;
}
.nav-links a:hover{color:var(--text);background:rgba(148,163,184,.08)}
.nav-links a.active{color:var(--accent)}
.nav-cta{
  font-family:var(--font-mono);font-size:13px;color:var(--accent) !important;
  border:1px solid rgba(52,211,153,.4);border-radius:8px;padding:8px 16px !important;margin-left:8px;
  transition:background .2s,box-shadow .2s;
}
.nav-cta:hover{background:var(--accent-dim) !important;box-shadow:0 0 18px rgba(52,211,153,.2)}
.burger{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--text);margin:4px 0;transition:transform .25s,opacity .25s}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.mobile-menu{
  display:none;position:fixed;top:var(--nav-h);left:0;right:0;z-index:99;
  background:rgba(7,11,20,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  flex-direction:column;padding:12px 28px 22px;gap:2px;
}
.mobile-menu.open{display:flex}
.mobile-menu a{font-family:var(--font-mono);font-size:15px;color:var(--muted);padding:12px 4px;border-bottom:1px solid rgba(148,163,184,.07)}
.mobile-menu a:hover{color:var(--accent)}

/* ---------- Hero ---------- */
.hero{
  position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding-top:var(--nav-h);overflow:hidden;
}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 40%,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 40%,black 30%,transparent 75%);
}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.orb-1{width:520px;height:520px;background:radial-gradient(circle,rgba(52,211,153,.16),transparent 65%);top:-8%;right:-6%}
.orb-2{width:460px;height:460px;background:radial-gradient(circle,rgba(59,130,246,.12),transparent 65%);bottom:4%;left:-10%}
.hero-content{position:relative;z-index:2}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  border:1px solid rgba(52,211,153,.3);border-radius:999px;padding:7px 16px;background:rgba(52,211,153,.06);
}
.hero-kicker .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dotpulse 2.2s ease-in-out infinite}
@keyframes dotpulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{box-shadow:0 0 0 6px rgba(52,211,153,0)}}
.hero h1{
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(52px,9.5vw,116px);line-height:.98;letter-spacing:-.03em;
  margin:26px 0 10px;
}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line>span{display:inline-block}
.hero h1 .accent-line{color:transparent;background:linear-gradient(100deg,var(--accent) 0%,#5EEAD4 55%,#3B82F6 110%);-webkit-background-clip:text;background-clip:text}
.hero-sub{
  font-family:var(--font-mono);font-size:clamp(15px,2vw,19px);color:var(--muted);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px;
}
.hero-sub .sep{color:var(--muted-2)}
.hero-desc{max-width:640px;font-size:clamp(16px,1.6vw,18.5px);font-weight:300;color:#B4BCCD;margin:0 0 40px}
.hero-desc strong{color:var(--text);font-weight:500}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  font-family:var(--font-mono);font-size:14.5px;font-weight:500;border-radius:10px;padding:14px 26px;
  transition:transform .2s,box-shadow .25s,background .2s,border-color .2s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#04110B;border:1px solid var(--accent)}
.btn-primary:hover{box-shadow:0 6px 28px var(--accent-glow);transform:translateY(-2px);color:#04110B}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.hero-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  margin-top:64px;
}
.stat{background:rgba(14,21,36,.75);padding:26px 26px 22px;transition:background .3s}
.stat:hover{background:var(--card-2)}
.stat-num{font-family:var(--font-head);font-weight:700;font-size:clamp(30px,3.4vw,42px);line-height:1;color:var(--text)}
.stat-num .plus{color:var(--accent)}
.stat-label{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.scroll-hint{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted-2);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
}
.scroll-hint .mouse{width:22px;height:36px;border:1.5px solid var(--muted-2);border-radius:12px;position:relative}
.scroll-hint .mouse::after{
  content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;
  background:var(--accent);animation:wheel 1.8s ease-in-out infinite;
}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:0}}

/* ---------- Marquee ---------- */
.marquee{
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  background:rgba(11,17,32,.6);overflow:hidden;padding:18px 0;position:relative;
}
.marquee-track{display:flex;gap:56px;width:max-content;animation:marquee 36s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-item{font-family:var(--font-mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:56px;white-space:nowrap}
.marquee-item::after{content:"◆";color:var(--accent);font-size:9px}

/* ---------- Sections ---------- */
section{position:relative}
.section{padding:110px 0}
.section-head{margin-bottom:56px}
.section-kicker{font-family:var(--font-mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px}
.section-kicker::before{content:"";width:34px;height:1px;background:var(--accent)}
.section-title{font-family:var(--font-head);font-weight:700;font-size:clamp(32px,4.6vw,52px);letter-spacing:-.02em;line-height:1.08;margin:16px 0 0}
.section-sub{color:var(--muted);max-width:620px;margin:16px 0 0;font-weight:300;font-size:17px}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:64px;align-items:start}
.about-text p{font-size:17.5px;font-weight:300;color:#B4BCCD;margin:0 0 20px}
.about-text p strong{color:var(--text);font-weight:500}
.about-points{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.about-point{display:flex;gap:14px;align-items:flex-start}
.about-point svg{flex:none;margin-top:3px;color:var(--accent)}
.about-point span{color:#B4BCCD;font-size:15.5px}
.exp-card{
  background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 100%);
  border:1px solid var(--border);border-radius:var(--radius);padding:34px;position:relative;overflow:hidden;
}
.exp-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.exp-role{font-family:var(--font-head);font-weight:600;font-size:21px}
.exp-org{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-top:6px;letter-spacing:.06em}
.exp-list{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
.exp-list li{position:relative;padding-left:20px;font-size:14.5px;color:var(--muted)}
.exp-list li::before{content:"▹";position:absolute;left:0;color:var(--accent)}

/* ---------- Featured credentials ---------- */
.featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cred-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;
  display:flex;flex-direction:column;
}
.cred-card:hover{transform:translateY(-6px);border-color:rgba(52,211,153,.4);box-shadow:0 24px 48px -18px rgba(0,0,0,.6),0 0 0 1px rgba(52,211,153,.12)}
.cred-img{position:relative;background:#fff;overflow:hidden}
.cred-img img{width:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cred-card:hover .cred-img img{transform:scale(1.03)}
.cred-body{padding:28px 30px 30px;display:flex;flex-direction:column;gap:14px;flex:1}
.cred-tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-dim);border:1px solid rgba(52,211,153,.25);
  border-radius:6px;padding:4px 10px;
}
.tag.blue{color:#7DB5FB;background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3)}
.cred-title{font-family:var(--font-head);font-weight:600;font-size:23px;line-height:1.2;margin:0}
.cred-desc{color:var(--muted);font-size:15px;margin:0;flex:1}
.cred-meta{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--border);padding-top:16px;
  font-family:var(--font-mono);font-size:12.5px;color:var(--muted-2);
}
.cred-meta .code{color:var(--accent)}

/* ---------- Courses ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
.filter-btn{
  font-family:var(--font-mono);font-size:13px;cursor:pointer;
  color:var(--muted);background:transparent;border:1px solid var(--border-strong);border-radius:999px;padding:9px 20px;
  transition:all .25s;
}
.filter-btn:hover{color:var(--text);border-color:var(--muted)}
.filter-btn.active{color:#04110B;background:var(--accent);border-color:var(--accent);font-weight:600}
.courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.course-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s,opacity .3s;
}
.course-card:hover{transform:translateY(-5px);border-color:rgba(52,211,153,.35);box-shadow:0 20px 40px -16px rgba(0,0,0,.55)}
.course-card.hidden{display:none}
.course-img{background:#fff;overflow:hidden}
.course-img img{width:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.course-card:hover .course-img img{transform:scale(1.04)}
.course-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.course-cat{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.course-title{font-family:var(--font-head);font-weight:600;font-size:17.5px;line-height:1.3;margin:0;flex:1}
.course-meta{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid var(--border);padding-top:14px;margin-top:6px;
  font-family:var(--font-mono);font-size:12px;color:var(--muted-2);
}
.course-meta a{color:var(--muted);transition:color .2s;display:inline-flex;align-items:center;gap:5px}
.course-meta a:hover{color:var(--accent)}

/* ---------- Capabilities ---------- */
.section-alt{background:var(--bg-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.cap-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px;
  position:relative;overflow:hidden;transition:transform .3s,border-color .3s;
}
.cap-card::after{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(52,211,153,.08),transparent 45%);
}
.cap-card:hover{transform:translateY(-4px);border-color:var(--border-strong)}
.cap-card:hover::after{opacity:1}
.cap-num{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.1em}
.cap-title{font-family:var(--font-head);font-weight:600;font-size:19px;margin:12px 0 8px;line-height:1.3}
.cap-desc{color:var(--muted);font-size:14.5px;margin:0}

/* ---------- Stack ---------- */
.stack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stack-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 22px;
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
.stack-card:hover{transform:translateY(-4px);border-color:rgba(52,211,153,.4);box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.stack-name{font-family:var(--font-mono);font-weight:600;font-size:16.5px;color:var(--text)}
.stack-name::before{content:"$ ";color:var(--accent)}
.stack-role{font-size:13.5px;color:var(--muted);margin-top:8px}

/* ---------- Contact ---------- */
.contact-wrap{text-align:center;max-width:720px;margin:0 auto}
.contact-wrap .section-kicker{justify-content:center}
.contact-wrap .section-kicker::after{content:"";width:34px;height:1px;background:var(--accent)}
.contact-title{font-family:var(--font-head);font-weight:700;font-size:clamp(36px,5.4vw,60px);letter-spacing:-.02em;line-height:1.06;margin:18px 0 20px}
.contact-title .hl{color:transparent;background:linear-gradient(100deg,var(--accent),#5EEAD4);-webkit-background-clip:text;background-clip:text}
.contact-sub{color:var(--muted);font-size:17px;font-weight:300;margin:0 0 42px}
.contact-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.verify-note{
  margin-top:56px;display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-mono);font-size:13px;color:var(--muted);
  border:1px solid var(--border);border-radius:10px;padding:13px 20px;background:rgba(14,21,36,.6);
}
.verify-note svg{color:var(--accent);flex:none}
footer{border-top:1px solid var(--border);padding:34px 0}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.footer-inner .copy{font-family:var(--font-mono);font-size:12.5px;color:var(--muted-2)}
.footer-links{display:flex;gap:22px}
.footer-links a{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);transition:color .2s}
.footer-links a:hover{color:var(--accent)}

/* ---------- Chat widget ---------- */
.chat-fab{
  position:fixed;right:24px;bottom:24px;z-index:200;
  width:62px;height:62px;border-radius:50%;cursor:pointer;
  background:linear-gradient(140deg,var(--accent) 0%,#10B981 100%);color:#04110B;border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(52,211,153,.35),0 4px 10px rgba(0,0,0,.4);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 14px 38px rgba(52,211,153,.45),0 4px 10px rgba(0,0,0,.4)}
.chat-fab:active{transform:scale(.95)}
.chat-fab::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(52,211,153,.5);
  animation:fabpulse 2.6s ease-out infinite;pointer-events:none;
}
@keyframes fabpulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.28)}}
.chat-fab svg{transition:transform .3s,opacity .2s;position:absolute}
.chat-fab .icon-close{opacity:0;transform:rotate(-90deg) scale(.5)}
.chat-fab.open .icon-chat{opacity:0;transform:rotate(90deg) scale(.5)}
.chat-fab.open .icon-close{opacity:1;transform:none}
.chat-fab.open::before{animation:none;opacity:0}
.chat-panel{
  position:fixed;right:24px;bottom:100px;z-index:199;
  width:380px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100svh - 130px);
  background:var(--bg-2);border:1px solid var(--border-strong);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 70px -12px rgba(0,0,0,.7);
  opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;
  transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .3s cubic-bezier(.2,.8,.2,1);
}
.chat-panel.open{opacity:1;transform:none;pointer-events:auto}
.chat-header{
  display:flex;align-items:center;gap:12px;padding:16px 18px;
  background:linear-gradient(140deg,#0D1B2A,#0E1F1A);border-bottom:1px solid var(--border);
}
.chat-avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:var(--accent-dim);border:1px solid rgba(52,211,153,.4);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.chat-name{font-family:var(--font-head);font-weight:600;font-size:15.5px;line-height:1.2}
.chat-status{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-top:3px}
.chat-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 2.2s infinite}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chat-body::-webkit-scrollbar{width:6px}
.msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word}
.msg.bot{align-self:flex-start;background:var(--card-2);border:1px solid var(--border);border-bottom-left-radius:4px;color:#C7CEDC}
.msg.user{align-self:flex-end;background:var(--accent);color:#04110B;border-bottom-right-radius:4px}
.msg.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1.2s ease-in-out infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}
.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.chat-suggestions{display:flex;flex-direction:column;gap:8px}
.chat-suggestions .sug-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.sug-btn{
  text-align:left;cursor:pointer;font-family:var(--font-body);font-size:13.5px;color:#C7CEDC;
  background:transparent;border:1px solid var(--border);border-radius:10px;padding:10px 13px;
  transition:border-color .2s,background .2s;
}
.sug-btn:hover{border-color:rgba(52,211,153,.45);background:var(--accent-dim)}
.chat-input-row{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--border);background:rgba(14,21,36,.6)}
.chat-input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:var(--font-body);font-size:14.5px;padding:11px 13px;outline:none;
  transition:border-color .2s;
}
.chat-input:focus{border-color:rgba(52,211,153,.5)}
.chat-send{
  width:44px;height:44px;border-radius:10px;flex:none;cursor:pointer;
  background:var(--accent);color:#04110B;border:none;display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s;
}
.chat-send:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--accent-glow)}
.chat-send:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

/* ---------- Chat nudge popup ---------- */
.chat-nudge{
  position:fixed;right:24px;bottom:100px;z-index:198;
  display:flex;align-items:flex-start;gap:10px;max-width:270px;cursor:pointer;
  background:var(--card-2);border:1px solid rgba(52,211,153,.35);border-radius:14px;border-bottom-right-radius:4px;
  padding:14px 16px;box-shadow:0 16px 40px -10px rgba(0,0,0,.6),0 0 0 1px rgba(52,211,153,.08);
  font-size:14px;line-height:1.45;color:#C7CEDC;
  opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;
  transition:opacity .35s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1);
}
.chat-nudge.show{opacity:1;transform:none;pointer-events:auto}
.chat-nudge::after{
  content:"";position:absolute;right:22px;bottom:-7px;width:12px;height:12px;
  background:var(--card-2);border-right:1px solid rgba(52,211,153,.35);border-bottom:1px solid rgba(52,211,153,.35);
  transform:rotate(45deg);
}
.chat-nudge strong{color:var(--accent);font-weight:600}
.nudge-close{
  flex:none;order:2;margin:-4px -6px 0 0;width:24px;height:24px;cursor:pointer;
  background:transparent;border:none;color:var(--muted-2);font-size:16px;line-height:1;border-radius:6px;
}
.nudge-close:hover{color:var(--text);background:rgba(148,163,184,.12)}
@media (max-width:560px){.chat-nudge{right:16px;bottom:90px}}

/* ---------- Scroll reveals (CSS-driven; .js set before first paint) ----------
   Content is visible by default: no JS or prefers-reduced-motion = no hiding. */
@media (prefers-reduced-motion:no-preference){
  .js [data-reveal]{
    opacity:0;transform:translateY(26px);
    transition:opacity .65s ease var(--d,0s),transform .65s cubic-bezier(.2,.8,.2,1) var(--d,0s);
  }
  .js [data-reveal].in{opacity:1;transform:none}
  .js [data-hero]{
    opacity:0;transform:translateY(30px);
    transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0s);
  }
  .js .hero.in [data-hero]{opacity:1;transform:none}
  @keyframes popin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .course-card.pop{animation:popin .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
}

/* ---------- Responsive ----------
   Large displays: scale the whole layout up so the site matches the
   viewer's resolution instead of floating small in the middle. */
@media (min-width:1720px){html{zoom:1.18}}
@media (min-width:2200px){html{zoom:1.45}}
@media (min-width:3200px){html{zoom:1.9}}
@media (max-width:1024px){
  .courses-grid{grid-template-columns:repeat(2,1fr)}
  .cap-grid{grid-template-columns:repeat(2,1fr)}
  .stack-grid{grid-template-columns:repeat(2,1fr)}
  .about-grid{grid-template-columns:1fr;gap:44px}
}
@media (max-width:820px){
  .nav-links{display:none}
  .burger{display:block}
  .featured-grid{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .section{padding:84px 0}
}
@media (max-width:560px){
  .courses-grid{grid-template-columns:1fr}
  .cap-grid{grid-template-columns:1fr}
  .stack-grid{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .container{padding:0 20px}
  .chat-panel{right:16px;bottom:92px}
  .chat-fab{right:16px;bottom:16px}
  .scroll-hint{display:none}
}
</style>
<script>document.documentElement.classList.add('js');</script>

<main id="top">

<!--{ABOUT}-->
<!--{CREDENTIALS}-->
<!--{COURSES}-->
<!--{SKILLS}-->
<!--{CONTACT}-->
</main>

<!--{FOOTER}-->
<!--{CHAT_WIDGET}-->

<script>
(function () {
  'use strict';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Nav: background on scroll + active link ---- */
  var nav = document.getElementById('nav');
  var navLinks = document.querySelectorAll('.nav-links a[href^="#"]');
  var sections = ['about', 'credentials', 'courses', 'skills', 'contact'].map(function (id) {
    return document.getElementById(id);
  });
  function onScroll() {
    nav.classList.toggle('scrolled', window.scrollY > 24);
    var pos = window.scrollY + window.innerHeight * 0.35;
    var current = '';
    sections.forEach(function (s) { if (s && s.offsetTop <= pos) current = s.id; });
    navLinks.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ---- Mobile menu ---- */
  var burger = document.getElementById('burger');
  var mobileMenu = document.getElementById('mobileMenu');
  burger.addEventListener('click', function () {
    var open = mobileMenu.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open);
  });
  mobileMenu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      mobileMenu.classList.remove('open');
      burger.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
    });
  });

  /* ---- Marquee: duplicate track for seamless loop ---- */
  var track = document.getElementById('marqueeTrack');
  track.innerHTML += track.innerHTML;

  /* ---- Hero entrance: staggered via transition-delay ---- */
  var hero = document.querySelector('.hero');
  document.querySelectorAll('[data-hero]').forEach(function (el, i) {
    el.style.setProperty('--d', (0.1 + i * 0.12).toFixed(2) + 's');
  });
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { hero.classList.add('in'); });
  });
  // Safety: if rAF is throttled (background tab), force the end state.
  setTimeout(function () { hero.classList.add('in'); }, 400);

  /* ---- Scroll reveals: IntersectionObserver + CSS transitions ---- */
  var revealEls = document.querySelectorAll('[data-reveal]');
  if ('IntersectionObserver' in window) {
    var pending = [];
    var flushTimer = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        io.unobserve(entry.target);
        pending.push(entry.target);
      });
      // Batch entries arriving together so siblings stagger naturally.
      if (pending.length && !flushTimer) {
        flushTimer = setTimeout(function () {
          pending.forEach(function (el, i) {
            el.style.setProperty('--d', Math.min(i * 0.08, 0.5).toFixed(2) + 's');
            el.classList.add('in');
          });
          pending = [];
          flushTimer = null;
        }, 40);
      }
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in'); });
  }

  /* ---- Stat counters (time-based, snaps to final value) ---- */
  function runCounter(el) {
    var target = parseInt(el.getAttribute('data-count'), 10);
    if (reduceMotion) { el.textContent = target; return; }
    var t0 = performance.now(), dur = 1400;
    function tick(now) {
      var p = Math.min((now - t0) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    setTimeout(function () { el.textContent = target; }, dur + 200);
  }
  document.querySelectorAll('[data-count]').forEach(function (el) {
    setTimeout(function () { runCounter(el); }, 700);
  });

  /* ---- Parallax orbs on scroll ---- */
  var orb1 = document.querySelector('[data-orb="1"]');
  var orb2 = document.querySelector('[data-orb="2"]');
  if (!reduceMotion && orb1) {
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var y = window.scrollY;
        if (y < window.innerHeight * 1.4) {
          orb1.style.transform = 'translateY(' + y * 0.18 + 'px)';
          orb2.style.transform = 'translateY(' + y * -0.14 + 'px)';
        }
        ticking = false;
      });
    }, { passive: true });
  }

  /* ---- Capability cards: cursor glow ---- */
  document.querySelectorAll('.cap-card').forEach(function (card) {
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  /* ---- Course filters ---- */
  var filterBtns = document.querySelectorAll('.filter-btn');
  var courseCards = document.querySelectorAll('.course-card');
  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var f = btn.getAttribute('data-filter');
      var shown = [];
      courseCards.forEach(function (card) {
        card.classList.remove('pop');
        var show = f === 'all' || card.getAttribute('data-cat') === f;
        card.classList.toggle('hidden', !show);
        if (show) shown.push(card);
      });
      requestAnimationFrame(function () {
        shown.forEach(function (card, i) {
          card.style.setProperty('--d', (i * 0.05).toFixed(2) + 's');
          card.classList.add('pop');
        });
      });
    });
  });
})();
</script>
<script type="module">
/* ============ AI chat assistant ============ */
// System prompt + starter questions live in assistant-config.js.
// The backend is a Supabase Edge Function that holds the OpenRouter key
// and enforces the per-visitor daily limit (supabase/functions/chat/index.ts).
const CHAT_URL = '<!--{CHAT_URL}-->';

let profile = '';
let suggestions = <!--{FALLBACK_SUGGESTIONS}-->;
try {
  const cfg = await import('./assistant-config.js');
  profile = cfg.profile;
  suggestions = cfg.suggestions;
} catch (e) { /* fall back to defaults above; backend still validates */ }

const fab = document.getElementById('chatFab');
const panel = document.getElementById('chatPanel');
const body = document.getElementById('chatBody');
const input = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');
const sugWrap = document.getElementById('chatSuggestions');

const messages = [];
let busy = false;

suggestions.forEach(text => {
  const b = document.createElement('button');
  b.className = 'sug-btn';
  b.type = 'button';
  b.textContent = text;
  b.addEventListener('click', () => send(text));
  sugWrap.appendChild(b);
});

/* Nudge popup: invites visitors to try the assistant. Shows once per
   session after a short delay; goes away on dismiss or when chat opens. */
const nudge = document.getElementById('chatNudge');
const nudgeClose = document.getElementById('nudgeClose');
let nudgeSeen = false;
try { nudgeSeen = sessionStorage.getItem('nudge-seen') === '1'; } catch (e) {}
function hideNudge() {
  nudge.classList.remove('show');
  try { sessionStorage.setItem('nudge-seen', '1'); } catch (e) {}
}
if (!nudgeSeen) {
  setTimeout(() => {
    if (!panel.classList.contains('open')) nudge.classList.add('show');
  }, 3500);
  setTimeout(hideNudge, 18000);
}
nudgeClose.addEventListener('click', e => { e.stopPropagation(); hideNudge(); });
nudge.addEventListener('click', () => { hideNudge(); if (!panel.classList.contains('open')) toggle(); });

function toggle() {
  const open = !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  fab.classList.toggle('open', open);
  fab.setAttribute('aria-expanded', open);
  panel.setAttribute('aria-hidden', !open);
  if (open) { hideNudge(); setTimeout(() => input.focus(), 250); }
}
fab.addEventListener('click', toggle);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panel.classList.contains('open')) toggle();
});

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

async function send(preset) {
  const q = (typeof preset === 'string' ? preset : input.value).trim();
  if (!q || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  if (sugWrap) sugWrap.remove();
  addMsg('user', q);
  messages.push({ role: 'user', content: q });

  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.innerHTML = '<i></i><i></i><i></i>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;

  try {
    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: profile, messages })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok && !data.reply) throw new Error(data.error || res.status);
    typing.remove();
    addMsg('bot', data.reply);
    messages.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    typing.remove();
    addMsg('bot', 'Something went wrong reaching the model. Try again in a moment.');
  }
  busy = false;
  sendBtn.disabled = false;
}
sendBtn.addEventListener('click', () => send());
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
